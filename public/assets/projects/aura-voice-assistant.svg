<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">AURA Voice Assistant architecture</title>
  <desc id="desc">A webhook automation flow connecting Vapi voice calls to Postmark email and Google Calendar actions.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1440" height="1000" fill="#050816"/>
  <rect width="1440" height="1000" fill="url(#bgGlow)"/>
  <g opacity="0.2" stroke="#ffffff" stroke-width="1">
    <path d="M0 210H1440"/>
    <path d="M0 410H1440"/>
    <path d="M0 610H1440"/>
    <path d="M0 810H1440"/>
    <path d="M220 0V1000"/>
    <path d="M500 0V1000"/>
    <path d="M780 0V1000"/>
    <path d="M1060 0V1000"/>
  </g>
  <g transform="translate(120 110)">
    <text x="0" y="0" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="7">AI VOICE AUTOMATION</text>
    <text x="0" y="96" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="92" font-weight="800">AURA Voice Assistant</text>
    <text x="0" y="150" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="30">Vapi webhook service for onboarding email and calendar actions.</text>
  </g>
  <g transform="translate(135 340)" filter="url(#softShadow)">
    <rect x="0" y="0" width="330" height="240" rx="34" fill="url(#panel)" stroke="#1e40af" stroke-width="2"/>
    <circle cx="76" cy="82" r="30" fill="#0f172a" stroke="#67e8f9" stroke-width="4"/>
    <path d="M76 58v48M54 82h44" stroke="#67e8f9" stroke-width="8" stroke-linecap="round"/>
    <text x="44" y="165" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Vapi Call</text>
    <text x="44" y="202" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22">tool call payload</text>
  </g>
  <g transform="translate(555 300)" filter="url(#softShadow)">
    <rect x="0" y="0" width="330" height="320" rx="38" fill="#08111f" stroke="#38bdf8" stroke-width="3"/>
    <rect x="42" y="54" width="246" height="76" rx="18" fill="url(#accent)"/>
    <text x="73" y="105" fill="#03111f" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900">/webhook</text>
    <text x="44" y="186" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">Express API</text>
    <text x="44" y="225" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="22">responds immediately</text>
    <text x="44" y="258" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="22">runs actions in background</text>
  </g>
  <g transform="translate(990 260)" filter="url(#softShadow)">
    <rect x="0" y="0" width="330" height="210" rx="32" fill="url(#panel)" stroke="#10b981" stroke-width="2"/>
    <text x="42" y="72" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Postmark</text>
    <text x="42" y="112" fill="#a7f3d0" font-family="Inter, Arial, sans-serif" font-size="22">onboarding email</text>
    <text x="42" y="151" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20">send_link intent</text>
  </g>
  <g transform="translate(990 540)" filter="url(#softShadow)">
    <rect x="0" y="0" width="330" height="210" rx="32" fill="url(#panel)" stroke="#f59e0b" stroke-width="2"/>
    <text x="42" y="72" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Calendar</text>
    <text x="42" y="112" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="22">15-minute invite</text>
    <text x="42" y="151" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20">book_call intent</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 460C505 460 515 460 550 460" stroke="#67e8f9" stroke-width="7"/>
    <path d="M535 441l20 19-20 19" stroke="#67e8f9" stroke-width="7"/>
    <path d="M890 405C940 350 935 365 984 365" stroke="#10b981" stroke-width="7"/>
    <path d="M964 344l24 20-24 20" stroke="#10b981" stroke-width="7"/>
    <path d="M890 515C940 610 935 645 984 645" stroke="#f59e0b" stroke-width="7"/>
    <path d="M964 624l24 20-24 20" stroke="#f59e0b" stroke-width="7"/>
  </g>
  <g transform="translate(120 790)">
    <rect x="0" y="0" width="1200" height="94" rx="24" fill="#020617" stroke="#1e293b"/>
    <text x="36" y="39" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Node.js + Express + Vapi.ai + Postmark + Google Calendar API</text>
    <text x="36" y="71" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="18">Private backend workflow represented as a public-safe architecture view.</text>
  </g>
</svg>
